name: Build and Push VIO Images (ARM64)

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      openvins_repository:
        description: OpenVINS Git repository to build
        required: false
        default: https://github.com/skymule-ai/open_vins.git
        type: string
      openvins_ref:
        description: OpenVINS ref to build (prefer a full commit SHA)
        required: false
        default: 55c5767995a88444079491cba898e384435b0ed1
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - implementation: openvins
            dockerfile: images/openvins/Dockerfile
            image: ghcr.io/skymule-ai/mullet-ros-vio-openvins

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          build-args: |
            BASE_IMAGE=ghcr.io/skymule-ai/mullet-ros2-base:v0.4.0
            OPENVINS_REPOSITORY=${{ inputs.openvins_repository || vars.OPENVINS_REPOSITORY || 'https://github.com/skymule-ai/open_vins.git' }}
            OPENVINS_REF=${{ inputs.openvins_ref || vars.OPENVINS_REF || '55c5767995a88444079491cba898e384435b0ed1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.implementation }}
          cache-to: type=gha,mode=max,scope=${{ matrix.implementation }}
